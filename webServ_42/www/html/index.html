<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserver</title>
    <link rel="stylesheet" href="./css/body.css">
</head>
<body>
     <div class="container">
        <h1>🚀 WebServ 42 - HTTP Tester</h1>
        
        <!-- GET Methods -->
        <div class="section">
            <h2>GET Requests</h2>
            <div class="button-group">
                <button class="btn-get" onclick="testGet('/')">GET /</button>
                <button class="btn-get" onclick="testGet('/test.html')">GET /test.html</button>
                <button class="btn-get" onclick="testGet('/404.html')">GET error</button>
            </div>
            <div class="input-group">
                <label>Custom GET Path:</label>
                <input type="text" id="customGetPath" placeholder="/your/custom/path">
                <button class="btn-get" onclick="testCustomGet()">Send GET</button>
            </div>
        </div>

        <!-- POST Methods -->
        <div class="section">
            <h2>POST Requests</h2>
            <div class="input-group">
                <label>Filename (will be saved in /upload/):</label>
                <input type="text" id="postFilename" value="test.json" placeholder="filename.json">
                <label>POST Body:</label>
                <textarea id="postBody" placeholder='{"name": "test", "value": "data"}'></textarea>
                <button class="btn-post" onclick="testPost()">Send POST (JSON)</button>
            </div>
            <div class="input-group">
                <label>Filename para Form Data (será salvo em /upload/):</label>
                <input type="text" id="postFormFilename" value="formdata.txt" placeholder="formdata.txt">
                <button class="btn-post" onclick="testPostForm()">Send POST (Form Data)</button>
            </div>
        </div>

        <!-- DELETE Methods -->
        <div class="section">
            <h2>DELETE Requests</h2>
            <div class="input-group">
                <label>Filename em /upload/ para deletar:</label>
                <input type="text" id="deleteFilename" value="test.json" placeholder="filename.json">
                <button class="btn-delete" onclick="testDelete()">Send DELETE</button>
            </div>
        </div>

        <!-- File Upload -->
        <div class="section">
            <h2>File Upload</h2>
            <div class="input-group">
                <label>Select File (será salvo em /upload/):</label>
                <input type="file" id="fileUpload">
                <button class="btn-upload" onclick="testFileUpload()">Upload File</button>
            </div>
        </div>

        <!-- CGI Test -->
        <div class="section">
            <h2>CGI Test</h2>
            <div class="button-group">
                <button class="btn-cgi" onclick="testCGI('/cgi-bin/test.py')">Test Python CGI</button>
                <button class="btn-cgi" onclick="testCGI('/cgi-bin/test.sh')">Test Shell CGI</button>
            </div>
            <div class="input-group">
                <label>Custom CGI Path:</label>
                <input type="text" id="cgiPath" placeholder="/cgi-bin/script.py">
                <button class="btn-cgi" onclick="testCustomCGI()">Run CGI</button>
            </div>
        </div>

        <!-- Response Display -->
        <div class="section">
            <h2>Response</h2>
            <div id="response">Waiting for request...</div>
        </div>
    </div>

    <script src="./js/tests.js"></script>
</body>
</html>
